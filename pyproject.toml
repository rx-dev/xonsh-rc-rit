[project]
name = "xonsh-rc-rit"
version = "0.2.0"
description = "Rit's uv-managed Xonsh configuration"
requires-python = ">=3.14"
authors = [{name = "RitikShah", email = "ritik10.shah@gmail.com"}]
readme = "README.md"
dependencies = [
    "xonsh[full]>=0.24.2",
    "rich>=13",
    "pandas>=2",
    "hunter>=3",
    "nbtlib>=2",
    "httpx[http2]>=0.28",
    "requests>=2",
    "colour>=0.1.5",
    "xontrib-abbrevs",
    "xontrib-bashisms",
    "xontrib-cd",
    "xontrib-jedi",
    "xontrib-mod",
    "xontrib-onepath",
    "xontrib-sh",
    "xontrib-whole-word-jumping",
    "xontrib-xlsd",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xontrib"]
