[character]
error_symbol = "[@](bold red)"
success_symbol = "[@](bold green)"

[package]
disabled = true

[python]
python_binary = ["python3", "python"]

[nodejs]
disabled = true

[aws]
disabled = true

[custom.github]
ignore_timeout = false
command = "cat ~/.config/xonsh/GITHUB_USER"
description = "Github user name"
format = "\uf415 [$output](bold italic green) "
shell = ["/bin/sh"]
when = true

# Keep branch/commit information without scanning the worktree on each prompt.
[git_status]
disabled = true

[git_metrics]
disabled = true
